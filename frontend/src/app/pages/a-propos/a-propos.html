<div class="container py-4">
  <h2 class="mb-4">À propos</h2>

  <div class="row g-3">
    <div class="col-12" *ngFor="let etape of etapes">
      <div class="card border-0 shadow-sm p-3">
        <div class="d-flex align-items-start gap-3">
          <div class="p-2 bg-light rounded text-primary fs-4">
            <i class="bi" [ngClass]="etape.icone"></i>
          </div>
          <div>
            <h5 class="fw-bold mb-1">{{ etape.titre }}</h5>
            <p class="text-muted mb-0">{{ etape.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>


  <p class="mt-4 text-muted">
    Envie d'en savoir plus sur le projet ? 
    <a routerLink="/portfolio" class="fw-bold text-decoration-underline ms-1" style="color: #0b3d24;">
      Découvre l'histoire derrière InfraScan Pro
    </a>
  </p>
</div>
